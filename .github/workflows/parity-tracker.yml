name: Parity tracker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolfconquer-parity-tracker
  cancel-in-progress: true

jobs:
  render:
    if: github.repository == 'vgcman16/wolfconquer' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, wolfconquer-trusted]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the triggering main commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test, render and verify the reviewed assessment
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          PARITY_PYTHON: ${{ vars.WOLFCONQUER_PARITY_PYTHON }}
          PARITY_PYTHON_SHA256: ${{ vars.WOLFCONQUER_PARITY_PYTHON_SHA256 }}
        run: |
          $python = $env:PARITY_PYTHON
          if (-not [IO.Path]::IsPathFullyQualified($python) -or $python.StartsWith('\\') -or -not (Test-Path -LiteralPath $python -PathType Leaf)) {
            throw 'Configure an explicit local Python executable in the repository Actions variables.'
          }
          for ($path = $python; $path; $path = [IO.Path]::GetDirectoryName($path)) {
            if ((Get-Item -LiteralPath $path -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Linked renderer paths are refused.' }
          }
          if ($env:PARITY_PYTHON_SHA256 -cnotmatch '^[A-F0-9]{64}$' -or (Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash -cne $env:PARITY_PYTHON_SHA256) {
            throw 'The configured Python executable identity changed; remeasure it before accepting an upgrade.'
          }
          & $python -m unittest discover -s tools/parity/tests
          if ($LASTEXITCODE -ne 0) { throw 'Parity renderer tests failed.' }
          & $python tools/parity/generate.py --root $env:GITHUB_WORKSPACE --commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Parity generation failed.' }
          & $python tools/parity/generate.py --root $env:GITHUB_WORKSPACE --commit $env:SOURCE_COMMIT --check
          if ($LASTEXITCODE -ne 0) { throw 'Parity output verification failed.' }
      - name: Publish only generated tracker files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git add -- docs/parity/progress.gif docs/parity/progress.png docs/parity/PROGRESS.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not stage generated tracker files.' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Tracker already matches the source assessment.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw 'Could not inspect staged tracker changes.' }
          $advertised = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect trusted main.' }
          if ($advertised.Split("`t")[0] -cne $env:SOURCE_COMMIT) {
            Write-Output 'Main changed; a newer push owns the refresh. No force push.'
            exit 0
          }
          git -c user.name=vgcman16 -c user.email=155417613+vgcman16@users.noreply.github.com commit -m "Refresh parity tracker [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit generated tracker files.' }
          $helper = '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; fi; }; f'
          git -c credential.helper= -c ("credential.helper=" + $helper) push origin HEAD:refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Generated tracker push failed; no force push or rewrite attempted.' }
