name: Windows local checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolfconquer-windows-local
  cancel-in-progress: false

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, wolfconquer-trusted]
    timeout-minutes: 45
    steps:
      - name: Check out trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check solution, Windows launcher, and receipt parsers sequentially
        shell: pwsh
        run: ./tools/dev/Invoke-LocalCheck.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
      - name: Write result summary
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('last-check.json', 'last-updater-smoke.json')) {
            $receipt = Join-Path $env:GITHUB_WORKSPACE ".artifacts/local-dev/$name"
            if (Test-Path -LiteralPath $receipt) {
              $text = Get-Content -LiteralPath $receipt -Raw
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("### $name`n" + '```json' + "`n" + $text + "`n" + '```')
            }
          }
          $checkPath = Join-Path $env:GITHUB_WORKSPACE '.artifacts/local-dev/last-check.json'
          if (Test-Path -LiteralPath $checkPath) {
            $check = Get-Content -LiteralPath $checkPath -Raw | ConvertFrom-Json
            foreach ($kind in @('solution', 'launcher')) {
              $results = Join-Path $env:GITHUB_WORKSPACE ('.artifacts/local-dev/' + $check.runId + '-' + $kind + '-results')
              if (-not (Test-Path -LiteralPath $results)) { continue }
              foreach ($result in Get-ChildItem -LiteralPath $results -Recurse -Filter '*.trx') {
                [xml]$trx = Get-Content -LiteralPath $result.FullName -Raw
                $definitions = @($trx.TestRun.TestDefinitions.UnitTest)
                $outcomes = @($trx.TestRun.Results.UnitTestResult | Group-Object outcome | Select-Object Name, Count)
                $summary = [ordered]@{
                  runId = $check.runId
                  assembly = [IO.Path]::GetFileName([string]$definitions[0].TestMethod.codeBase)
                  outcomes = $outcomes
                } | ConvertTo-Json -Depth 4 -Compress
                Write-Host ('Terminal TRX: ' + $summary)
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('Terminal TRX: ' + $summary)
              }
            }
          }
