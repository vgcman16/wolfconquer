name: Windows local checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolfconquer-windows-local
  cancel-in-progress: false

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, wolfconquer-trusted]
    timeout-minutes: 45
    steps:
      - name: Check out trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore, build, and test sequentially
        shell: pwsh
        run: ./tools/dev/Invoke-LocalCheck.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE
      - name: Write result summary
        if: always()
        shell: pwsh
        run: |
          $receipt = Join-Path $env:GITHUB_WORKSPACE '.artifacts/local-dev/last-check.json'
          if (Test-Path -LiteralPath $receipt) {
            $text = Get-Content -LiteralPath $receipt -Raw
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ('```json' + "`n" + $text + "`n" + '```')
          }
